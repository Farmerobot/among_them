[project]
name = "among_them"
version = "0.1.0"
description = "This project tests and compares the persuasive abilities of large language models (LLMs) in a game-like environment simulating 'Among Us', where AI agents powered by LLMs interact, make decisions, and attempt to persuade each other."
authors = [
    { name = "Marcin Korcz" },
    { name = "Andrii Chmutov" },
    { name = "Vasyl Korzavatykh" },
    { name = "Mateusz Idziejczak" },
    { name = "Mateusz Stawicki" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "tiktoken>=0.9.0",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "pytest (>=8.3.3,<9.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
    "ollama (>=0.4.7,<0.5.0)",
    "jsonpickle>=4.0.2",
    "streamlit (>=1.44.0,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "networkx (>=3.4.2,<4.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "mlx-lm>=0.22.5",
    "transformers>=4.35.0,<5.0.0",
    "torch>=2.0.1,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "umap-learn>=0.5.4,<1.0.0",
    "plotly>=5.16.0,<6.0.0",
    "scipy>=1.10.0,<2.0.0",
    "tqdm>=4.65.0,<5.0.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
main = "among_them.main:main"

[tool.mypy]
disable_error_code = ["import-untyped"]
