[project]
name = "among_them"
version = "0.1.0"
description = "This project tests and compares the persuasive abilities of large language models (LLMs) in a game-like environment simulating 'Among Us', where AI agents powered by LLMs interact, make decisions, and attempt to persuade each other."
authors = [
    { name = "Marcin Korcz" },
    { name = "Andrii Chmutov" },
    { name = "Vasyl Korzavatykh" },
    { name = "Mateusz Idziejczak" },
    { name = "Mateusz Stawicki" }
]
packages = [
    { include = "among_them", from = "src" }
]
package-mode = true
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "tiktoken>=0.9.0",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "pytest (>=8.3.3,<9.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
    "ollama (>=0.4.7,<0.5.0)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
main = "scripts.main:main"
tournament = "scripts.tournament:main"

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    "ANN001",   # Missing type annotation for function argument
    "DOC",      # Pydoclint
    "D",        # Pydocstyle
    "E",        # Pycodestyle
    "F",        # Pyflakes
    "I",        # Isort
    "Q",        # Quotes
]

ignore = [
    "D1",       # Missing docstrings
    "D205",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
