[tool.poetry]
name = "among_them"
version = "0.1.0"
description = "This project tests and compares the persuasive abilities of large language models (LLMs) in a game-like environment simulating 'Among Us', where AI agents powered by LLMs interact, make decisions, and attempt to persuade each other."
authors = ["Marcin Korcz", "Andrii Chmutov", "Vasyl Korzavatykh", "Mateusz Idziejczak", "Mateusz Stawicki"]
readme = "README.md"
package-mode = true
packages = [
    { include = "among_them", from = "src" }
]

[project]
name = "hello-world"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
dependencies = [
    "tiktoken>=0.9.0",
    "pydantic (>=2.10.6,<3.0.0)",
    "openai (>=1.52.2,<2.0.0)",
    "langchain (>=0.3.4,<0.4.0)",
    "langchain-community (>=0.3.3,<0.4.0)",
    "langchain-openai (>=0.2.3,<0.3.0)",
    "langchain-google-genai (>=2.0.1,<3.0.0)",
    "streamlit (>=1.39.0,<2.0.0)",
    "st-annotated-text (>=4.0.1,<5.0.0)",
    "plotly (>=5.24.1,<6.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "scikit-learn (>=1.5.2,<2.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "krippendorff (>=0.8.0,<1.0.0)",
    "simpledorff (>=0.0.2,<0.1.0)",
    "pytest (>=8.3.3,<9.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
main = "scripts.main:main"
tournament = "scripts.tournament:main"

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    "ANN001",   # Missing type annotation for function argument
    "DOC",      # Pydoclint
    "D",        # Pydocstyle
    "E",        # Pycodestyle
    "F",        # Pyflakes
    "I",        # Isort
    "Q",        # Quotes
]

ignore = [
    "D1",       # Missing docstrings
    "D205",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
